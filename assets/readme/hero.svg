<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">A3S ORM — type-safe SQL for Rust</title>
  <desc id="desc">A typed Person table and Rust predicate flow through the A3S ORM compiler into PostgreSQL with separate bound parameters.</desc>

  <defs>
    <linearGradient id="brand" x1="60" y1="40" x2="1140" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#5B8CFF"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="24" fill="#0B1020"/>
  <path d="M500 0V374M0 374H1200" stroke="#94A3B8" stroke-opacity="0.22"/>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(60 42)">
      <rect width="44" height="44" rx="10" fill="#5B8CFF" fill-opacity="0.12" stroke="#5B8CFF"/>
      <text x="22" y="30" text-anchor="middle" fill="#5B8CFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="760">T</text>
      <path d="M9 12V8H16M35 12V8H28M9 32V36H16M35 32V36H28" fill="none" stroke="#9B7BFF" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="122" y="70" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="1.8">RUST / TYPE-SAFE SQL BUILDER</text>

    <text x="60" y="174" fill="#F4F7FB" font-size="76" font-weight="780" letter-spacing="-3.2">A3S ORM</text>
    <text x="60" y="229" fill="#F4F7FB" font-size="31" font-weight="720" letter-spacing="-0.8">Typed Rust schemas in.</text>
    <text x="60" y="270" fill="url(#brand)" font-size="31" font-weight="720" letter-spacing="-0.8">Parameterized SQL out.</text>
    <text x="60" y="311" fill="#94A3B8" font-size="18">Immutable queries · explicit dialects · async execution</text>

    <g transform="translate(60 334)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">
      <rect width="104" height="28" rx="7" fill="#5B8CFF" fill-opacity="0.12" stroke="#5B8CFF" stroke-opacity="0.7"/>
      <text x="52" y="19" text-anchor="middle" fill="#5B8CFF">RUST 1.85+</text>
      <rect x="116" width="114" height="28" rx="7" fill="#F4F7FB" fill-opacity="0.04" stroke="#94A3B8" stroke-opacity="0.45"/>
      <text x="173" y="19" text-anchor="middle" fill="#F4F7FB">POSTGRESQL</text>
      <rect x="242" width="84" height="28" rx="7" fill="#F4F7FB" fill-opacity="0.04" stroke="#94A3B8" stroke-opacity="0.45"/>
      <text x="284" y="19" text-anchor="middle" fill="#F4F7FB">SQLITE</text>
    </g>
  </g>

  <g id="typed-input" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(540 44)">
      <rect width="240" height="154" rx="12" fill="#F4F7FB" fill-opacity="0.035" stroke="#94A3B8" stroke-opacity="0.42"/>
      <text x="18" y="29" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="1.1">TABLE / PERSON</text>
      <path d="M0 44H240M0 80H240M0 116H240" stroke="#94A3B8" stroke-opacity="0.2"/>
      <text x="18" y="70" fill="#F4F7FB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">id</text>
      <text x="220" y="70" text-anchor="end" fill="#5B8CFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">i64</text>
      <text x="18" y="106" fill="#F4F7FB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">name</text>
      <text x="220" y="106" text-anchor="end" fill="#5B8CFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">String</text>
      <text x="18" y="142" fill="#F4F7FB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">age</text>
      <text x="220" y="142" text-anchor="end" fill="#5B8CFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">i32</text>
    </g>

    <g transform="translate(540 224)">
      <rect width="240" height="126" rx="12" fill="#F4F7FB" fill-opacity="0.035" stroke="#94A3B8" stroke-opacity="0.42"/>
      <text x="18" y="29" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="1.1">TYPED PREDICATE</text>
      <path d="M0 44H240" stroke="#94A3B8" stroke-opacity="0.2"/>
      <text x="18" y="78" fill="#F4F7FB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">Person::age()</text>
      <text x="18" y="108" fill="#9B7BFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">.gte(18)</text>
    </g>
  </g>

  <g id="compiler-flow">
    <path d="M780 121H808V196H834" fill="none" stroke="#5B8CFF" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M780 287H808V214H834" fill="none" stroke="#9B7BFF" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="822" cy="205" r="17" fill="#0B1020" stroke="#5B8CFF" stroke-width="2"/>
    <text x="822" y="212" text-anchor="middle" fill="#F4F7FB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">→</text>
  </g>

  <g id="compiled-output" transform="translate(850 44)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect width="300" height="306" rx="12" fill="#5B8CFF" fill-opacity="0.075" stroke="#5B8CFF" stroke-opacity="0.72"/>
    <text x="18" y="29" fill="#5B8CFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="1.1">COMPILED / POSTGRESQL</text>
    <path d="M0 44H300" stroke="#5B8CFF" stroke-opacity="0.28"/>

    <g fill="#F4F7FB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
      <text x="18" y="80">select</text>
      <text x="34" y="108" fill="#9B7BFF">"person"."id"</text>
      <text x="18" y="136">from <tspan fill="#9B7BFF">"person"</tspan></text>
      <text x="18" y="164">where</text>
      <text x="34" y="192">("person"."age"</text>
      <text x="50" y="220">&gt;= <tspan fill="#5B8CFF" font-weight="700">$1</tspan>)</text>
      <text x="18" y="248">limit <tspan fill="#5B8CFF" font-weight="700">$2</tspan></text>
    </g>

    <rect x="18" y="264" width="264" height="28" rx="7" fill="#0B1020" fill-opacity="0.72"/>
    <text x="30" y="283" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">PARAMS</text>
    <text x="112" y="283" fill="#5B8CFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">$1</text>
    <text x="142" y="283" fill="#F4F7FB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">18</text>
    <text x="200" y="283" fill="#5B8CFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">$2</text>
    <text x="230" y="283" fill="#F4F7FB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">20</text>
  </g>

  <g id="safety-line" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">
    <circle cx="60" cy="402" r="5" fill="#5B8CFF"/>
    <text x="78" y="408" fill="#F4F7FB" letter-spacing="0.8">RUNTIME VALUES NEVER ENTER SQL TEXT</text>
    <text x="1140" y="408" text-anchor="end" fill="#94A3B8" letter-spacing="1">SCHEMA → AST → DIALECT → DRIVER</text>
  </g>
</svg>
